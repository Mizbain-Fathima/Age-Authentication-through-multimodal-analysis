<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Comparison — Existing vs Fusion</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .comparison-row { display: flex; gap: 1rem; margin: 0.5rem 0; flex-wrap: wrap; }
        .comparison-box { flex: 1; min-width: 140px; padding: 0.75rem; border-radius: 8px; background: var(--card-bg, #1e1e2e); border: 1px solid rgba(255,255,255,0.1); }
        .comparison-box h4 { margin: 0 0 0.25rem 0; font-size: 0.9rem; color: #aaa; }
        .comparison-box .value { font-size: 1.5rem; font-weight: 700; }
        .comparison-box.fusion .value { color: #7dd3fc; }
        .comparison-diff { margin-top: 0.5rem; font-size: 0.95rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Age comparison</h1>
            <p class="subtitle">Existing (0.6×face + 0.4×voice) vs Fusion model — same flow as main app</p>
        </header>

        <main>
            <div class="video-section">
                <div class="camera-container">
                    <video id="videoBlur" autoplay playsinline muted></video>
                    <video id="videoSharp" autoplay playsinline muted></video>
                    <div class="video-status" id="videoStatus"><span class="status-dot"></span><span class="status-text">Camera Ready</span></div>
                </div>
            </div>

            <div class="captcha-section" id="captchaSection" style="display: none;">
                <div class="captcha-card">
                    <div class="captcha-label">Read the sentence clearly:</div>
                    <div class="captcha-text" id="captchaText"></div>
                </div>
            </div>

            <div class="controls">
                <button id="btnStart" class="btn btn-primary"><span class="btn-icon">▶</span> Start Verification</button>
                <button id="btnStop" class="btn btn-secondary" disabled><span class="btn-icon">⏹</span> Stop & Compare</button>
            </div>

            <div class="status-section" id="statusSection" style="display: none;">
                <div class="status-card"><div class="status-icon" id="statusIcon">⏳</div><div class="status-text" id="statusText">Processing...</div></div>
            </div>

            <div class="results-section" id="resultsSection" style="display: none;">
                <div class="result-card" id="resultCard">
                    <div class="result-badge" id="resultBadge"><span class="badge-icon" id="badgeIcon">✓</span><span class="badge-text" id="badgeText">VERIFIED</span></div>
                    <div class="age-display">
                        <div class="comparison-row">
                            <div class="comparison-box">
                                <h4>Existing (weighted)</h4>
                                <div class="value" id="ageExisting">--</div>
                            </div>
                            <div class="comparison-box fusion">
                                <h4>Fusion model</h4>
                                <div class="value" id="ageFusion">--</div>
                            </div>
                        </div>
                        <div class="comparison-diff" id="ageDiff"></div>
                        <div class="age-label">Estimated age comparison</div>
                    </div>
                    <div class="adult-status" id="adultStatus"><span class="adult-icon" id="adultIcon">✓</span><span class="adult-text" id="adultText">Age 18+</span></div>
                    <div class="metrics">
                        <div class="metric-item"><span class="metric-label">Confidence</span><div class="metric-bar"><div class="metric-fill" id="confidenceBar" style="width:0%"></div></div><span class="metric-value" id="confidenceValue">0%</span></div>
                    </div>
                    <div class="error-message" id="errorMessage" style="display: none;"></div>
                </div>
                <button id="btnRestart" class="btn btn-primary"><span class="btn-icon">🔄</span> Start New Comparison</button>
            </div>
        </main>
    </div>

    <script>
(function() {
    const API_BASE = window.location.origin;
    const MIN_RECORDING = 5;
    let mediaStream = null, videoStream = null, audioStream = null;
    let videoRecorder = null, videoChunks = [];
    let audioContext = null, audioSource = null, audioProcessor = null, audioSamples = [];
    let isRecording = false, recordingStart = null;
    let captchaId = null, captchaSentence = null;

    const el = (id) => document.getElementById(id);
    const show = (id, v) => { const e = el(id); if (e) e.style.display = v ? 'block' : 'none'; };
    const text = (id, s) => { const e = el(id); if (e) e.textContent = s; };

    function encodeWAV(samples, sampleRate) {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);
        const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
        writeStr(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true); writeStr(8, 'WAVE');
        writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
        writeStr(36, 'data'); view.setUint32(40, samples.length * 2, true);
        let off = 44;
        for (let i = 0; i < samples.length; i++) {
            const s = Math.max(-1, Math.min(1, samples[i]));
            view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            off += 2;
        }
        return new Blob([buffer], { type: 'audio/wav' });
    }

    async function initMedia() {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
        videoStream = new MediaStream(mediaStream.getVideoTracks());
        audioStream = new MediaStream(mediaStream.getAudioTracks());
        el('videoBlur').srcObject = videoStream;
        el('videoSharp').srcObject = videoStream;
        text('videoStatus', 'Camera Ready');
    }

    async function startVerification() {
        try {
            el('btnStart').disabled = true;
            el('btnStart').innerHTML = '<span class="btn-icon">⏳</span> Getting captcha...';
            const fd = new FormData();
            fd.append('action', 'start');
            const r = await fetch(API_BASE + '/api/process', { method: 'POST', body: fd });
            if (!r.ok) throw new Error('Captcha failed');
            const data = await r.json();
            if (data.action !== 'start' || !data.captcha_sentence) throw new Error('No captcha');
            captchaId = data.captcha_id;
            captchaSentence = data.captcha_sentence;
            text('captchaText', captchaSentence);
            show('captchaSection', true);
            await startRecording();
            el('btnStart').innerHTML = '<span class="btn-icon">▶</span> Recording...';
        } catch (e) {
            alert('Error: ' + e.message);
            el('btnStart').disabled = false;
            el('btnStart').innerHTML = '<span class="btn-icon">▶</span> Start Verification';
        }
    }

    async function startRecording() {
        videoChunks = [];
        audioSamples = [];
        videoRecorder = new MediaRecorder(videoStream, { mimeType: 'video/webm;codecs=vp8' });
        videoRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) videoChunks.push(e.data); };
        videoRecorder.start(100);
        audioContext = new AudioContext({ sampleRate: 16000 });
        audioSource = audioContext.createMediaStreamSource(audioStream);
        audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);
        audioProcessor.onaudioprocess = e => {
            if (isRecording) {
                const buf = e.inputBuffer.getChannelData(0);
                const copy = new Float32Array(buf.length);
                copy.set(buf);
                audioSamples.push(copy);
            }
        };
        audioSource.connect(audioProcessor);
        audioProcessor.connect(audioContext.destination);
        isRecording = true;
        recordingStart = Date.now();
        el('btnStop').disabled = false;
        text('videoStatus', 'Recording...');
    }

    async function stopAndVerify() {
        if (!isRecording) return;
        const duration = (Date.now() - recordingStart) / 1000;
        if (duration < MIN_RECORDING) {
            alert('Record at least ' + MIN_RECORDING + ' seconds.');
            return;
        }
        isRecording = false;
        videoRecorder.stop();
        audioProcessor.disconnect();
        audioSource.disconnect();
        el('btnStop').disabled = true;
        show('statusSection', true);
        text('statusText', 'Processing...');
        videoRecorder.onstop = processRecording;
    }

    async function processRecording() {
        const videoBlob = videoChunks.length ? new Blob(videoChunks, { type: 'video/webm' }) : null;
        let audioBlob = null;
        if (audioSamples.length) {
            const total = audioSamples.reduce((s, a) => s + a.length, 0);
            const concat = new Float32Array(total);
            let off = 0;
            for (const a of audioSamples) { concat.set(a, off); off += a.length; }
            audioBlob = encodeWAV(concat, 16000);
        }
        if (!videoBlob && !audioBlob) {
            show('statusSection', false);
            alert('No recording data.');
            el('btnStart').disabled = false;
            return;
        }
        const form = new FormData();
        form.append('action', 'verify');
        form.append('captcha_id', captchaId);
        if (videoBlob) form.append('video_file', videoBlob, 'video.webm');
        if (audioBlob) form.append('audio_file', audioBlob, 'audio.wav');
        form.append('sample_rate', '16000');
        form.append('duration', String((Date.now() - recordingStart) / 1000));
        try {
            const r = await fetch(API_BASE + '/api/process-with-fusion', { method: 'POST', body: form });
            const result = await r.json();
            show('statusSection', false);
            show('resultsSection', true);
            show('captchaSection', false);
            const existing = result.estimated_age != null ? Math.round(result.estimated_age) : '--';
            const fusion = result.fusion_age != null ? Math.round(result.fusion_age) : '--';
            text('ageExisting', existing);
            text('ageFusion', fusion);
            if (result.age_difference != null) text('ageDiff', 'Difference (fusion − existing): ' + (result.age_difference >= 0 ? '+' : '') + result.age_difference + ' years');
            else text('ageDiff', '');
            const ok = result.success === true;
            el('resultBadge').className = 'result-badge ' + (ok ? 'success' : 'failure');
            text('badgeIcon', ok ? '✓' : '✗');
            text('badgeText', ok ? 'VERIFIED' : 'FAILED');
            text('adultIcon', result.is_adult ? '✓' : '✗');
            text('adultText', result.is_adult ? 'Age 18+ Verified' : 'Under 18');
            const conf = result.confidence != null ? Math.round(result.confidence * 100) : 0;
            el('confidenceBar').style.width = conf + '%';
            text('confidenceValue', conf + '%');
            if (result.message && !ok) { el('errorMessage').textContent = result.message; el('errorMessage').style.display = 'block'; }
            else el('errorMessage').style.display = 'none';
        } catch (e) {
            show('statusSection', false);
            alert('Request failed: ' + e.message);
        }
        el('btnStart').disabled = false;
        el('btnStart').innerHTML = '<span class="btn-icon">▶</span> Start Verification';
    }

    function restart() {
        show('resultsSection', false);
        show('captchaSection', false);
        captchaId = null;
        captchaSentence = null;
        text('videoStatus', 'Camera Ready');
    }

    el('btnStart').addEventListener('click', startVerification);
    el('btnStop').addEventListener('click', stopAndVerify);
    el('btnRestart').addEventListener('click', restart);

    initMedia().catch(() => alert('Camera/mic access needed.'));
})();
    </script>
</body>
</html>
